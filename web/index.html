
<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>संधि विच्छेद</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <h1>संधि विच्छेद</h1>

        <div id="result" class="result"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
